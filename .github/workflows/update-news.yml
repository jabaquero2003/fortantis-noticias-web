name: Fortantis — Actualización de Noticias

on:
  schedule:
    # Lunes a viernes a las 14:30 UTC = 8:30 AM CDMX (UTC-6)
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    # Permite ejecución manual desde GitHub

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar actualización de noticias
        run: npx tsx scripts/updateNews.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Guardar noticias actualizadas
        run: |
          git config user.name "Fortantis Bot"
          git config user.email "bot@fortantis.com"
          git add data/news.json data/used-articles.json
          git diff --staged --quiet || git commit -m "📰 Edición actualizada [skip ci]"
          git pull --rebase -X theirs origin main
          git push
